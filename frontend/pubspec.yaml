name: medgraph
description: "MedGraph — verified medical networking for India."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend + Auth
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  http_parser: ^4.0.0
  shared_preferences: ^2.2.0

  # Routing + State
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  riverpod: ^2.5.0

  # Video + WebRTC
  livekit_client: ^2.1.0
  flutter_webrtc: ^0.10.0

  # Media
  cached_network_image: ^3.3.0
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  video_player: ^2.8.0
  camera: ^0.11.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.0

  # Payments
  razorpay_flutter: ^1.3.6

  # UI Utilities
  flutter_svg: ^2.0.0
  timeago: ^3.6.0
  intl: ^0.19.0

  # Firebase (FCM push notifications)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # Notifications + Socket
  flutter_local_notifications: ^17.2.0
  socket_io_client: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
