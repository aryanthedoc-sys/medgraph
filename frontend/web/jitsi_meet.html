<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MedGraph — Video Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #meet { width: 100%; height: 100%; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="meet"></div>
  <script src="https://meet.jit.si/external_api.js"></script>
  <script>
    const params  = new URLSearchParams(window.location.search);
    const roomId  = params.get('room')  || 'medgraph-room';
    const name    = params.get('name')  || 'MedGraph User';

    const api = new JitsiMeetExternalAPI('meet.jit.si', {
      roomName: roomId,
      parentNode: document.getElementById('meet'),
      width:  '100%',
      height: '100%',
      userInfo: { displayName: name },
      configOverwrite: {
        prejoinPageEnabled:        false,
        disableModeratorIndicator: true,
        startWithAudioMuted:       false,
        startWithVideoMuted:       false,
        enableLobbyChat:           false,
        autoKnockLobby:            true,
        securityUi: { hideLobbyButton: true, disableLobbyPassword: true },
        lobby: { enable: false, autoKnock: false },
      },
      interfaceConfigOverwrite: {
        HIDE_INVITE_MORE_HEADER:        true,
        MOBILE_APP_PROMO:               false,
        SHOW_CHROME_EXTENSION_BANNER:   false,
        TOOLBAR_BUTTONS: [
          'microphone', 'camera', 'closedcaptions', 'desktop',
          'fullscreen', 'fodeviceselection', 'hangup', 'chat',
          'settings', 'raisehand', 'videoquality', 'tileview',
        ],
      },
    });

    // As soon as we become moderator, kill the lobby so the partner isn't
    // trapped in a "knock to join" waiting screen.
    api.on('participantRoleChanged', (event) => {
      if (event.role === 'moderator') {
        api.executeCommand('toggleLobby', false);
      }
    });

    // Relay hangup back to the Flutter parent so it can navigate away
    api.on('readyToClose', () => {
      window.parent.postMessage({ type: 'jitsi-hangup' }, '*');
    });
  </script>
</body>
</html>
