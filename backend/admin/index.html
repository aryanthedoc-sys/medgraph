<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedGraph Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #000; color: #fff; min-height: 100vh; }
    #login { display: flex; align-items: center; justify-content: center;
             min-height: 100vh; }
    .login-box { background: #1c1c1e; border-radius: 16px; padding: 40px;
                 width: 100%; max-width: 360px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p.sub { color: #8e8e93; font-size: 14px; margin-bottom: 24px; }
    input { width: 100%; background: #2c2c2e; border: none; border-radius: 10px;
            padding: 14px 16px; color: #fff; font-size: 16px; margin-bottom: 12px; }
    input:focus { outline: 2px solid #fff; }
    button { width: 100%; background: #fff; color: #000; border: none;
             border-radius: 10px; padding: 14px; font-size: 16px;
             font-weight: 600; cursor: pointer; }
    button:hover { opacity: 0.9; }
    button.danger { background: #ff3b30; color: #fff; }
    button.approve { background: #34c759; color: #fff; }
    button.sm { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 8px; }

    #app { display: none; }
    .header { background: #1c1c1e; padding: 16px 24px; display: flex;
              align-items: center; border-bottom: 1px solid #2c2c2e; }
    .header h2 { font-size: 18px; font-weight: 700; flex: 1; }
    .tabs { display: flex; gap: 8px; padding: 16px 24px 0; }
    .tab { padding: 10px 20px; border-radius: 10px 10px 0 0; cursor: pointer;
           font-size: 14px; font-weight: 500; background: #1c1c1e; color: #8e8e93; }
    .tab.active { background: #2c2c2e; color: #fff; }
    .content { padding: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 12px; color: #8e8e93;
         border-bottom: 1px solid #2c2c2e; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid #1c1c1e; font-size: 14px;
         vertical-align: middle; }
    tr:hover td { background: #1c1c1e; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 20px;
             font-size: 11px; font-weight: 600; }
    .badge.pending { background: rgba(255,149,0,0.15); color: #ff9500; }
    .badge.verified { background: rgba(52,199,89,0.15); color: #34c759; }
    .badge.suspended { background: rgba(255,59,48,0.15); color: #ff3b30; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
    .stat-card { background: #1c1c1e; border-radius: 12px; padding: 20px; }
    .stat-card .num { font-size: 32px; font-weight: 800; }
    .stat-card .lbl { font-size: 13px; color: #8e8e93; margin-top: 4px; }
    .error { color: #ff3b30; font-size: 13px; margin-top: 8px; }
    a { color: #0a84ff; text-decoration: none; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-box">
    <h1>MedGraph Admin</h1>
    <p class="sub">Enter your admin password to continue.</p>
    <input type="password" id="pwdInput" placeholder="Admin password" />
    <div id="loginError" class="error"></div>
    <button onclick="doLogin()" style="margin-top:8px">Sign in</button>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <div class="header">
    <h2>MedGraph Admin</h2>
    <span style="color:#8e8e93;font-size:13px" id="headerStats"></span>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('pending')">Pending Doctors</div>
    <div class="tab" onclick="showTab('reports')">Reports</div>
    <div class="tab" onclick="showTab('stats')">Stats</div>
  </div>

  <div class="content">
    <!-- Pending doctors -->
    <div id="tab-pending">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>MRN</th><th>Specialty</th>
            <th>Submitted</th><th>ID Doc</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="pendingBody"></tbody>
      </table>
      <p id="pendingEmpty" style="color:#8e8e93;display:none;margin-top:16px">
        No pending doctors 🎉
      </p>
    </div>

    <!-- Reports -->
    <div id="tab-reports" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Reporter</th><th>Reported</th><th>Reason</th>
            <th>Date</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="reportsBody"></tbody>
      </table>
    </div>

    <!-- Stats -->
    <div id="tab-stats" style="display:none">
      <div class="stat-grid" id="statsGrid"></div>
    </div>
  </div>
</div>

<script>
  let password = '';
  const BASE = '/api/admin';

  function headers() {
    return { 'Content-Type': 'application/json', 'x-admin-password': password };
  }

  async function doLogin() {
    password = document.getElementById('pwdInput').value;
    const res = await fetch(`${BASE}/stats`, { headers: headers() });
    if (res.ok) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadAll();
    } else {
      document.getElementById('loginError').textContent = 'Incorrect password.';
    }
  }

  document.getElementById('pwdInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function showTab(name) {
    ['pending','reports','stats'].forEach(t => {
      document.getElementById('tab-' + t).style.display = t === name ? 'block' : 'none';
    });
    document.querySelectorAll('.tab').forEach((el, i) => {
      el.classList.toggle('active', ['pending','reports','stats'][i] === name);
    });
  }

  function loadAll() {
    loadPending();
    loadReports();
    loadStats();
  }

  async function loadPending() {
    const res  = await fetch(`${BASE}/pending-doctors`, { headers: headers() });
    const data = await res.json();
    const doctors = data.doctors || [];
    const body = document.getElementById('pendingBody');
    body.innerHTML = '';
    document.getElementById('pendingEmpty').style.display =
      doctors.length === 0 ? 'block' : 'none';

    doctors.forEach(d => {
      const date = new Date(d.created_at).toLocaleDateString('en-IN');
      body.innerHTML += `
        <tr id="row-${d.id}">
          <td><strong>${esc(d.full_name)}</strong><br>
              <span style="color:#8e8e93;font-size:12px">${esc(d.email)}</span></td>
          <td>${esc(d.mrn)}</td>
          <td>${esc(d.specialty || '—')}</td>
          <td>${date}</td>
          <td>${d.id_photo_url
            ? `<a href="${esc(d.id_photo_url)}" target="_blank">View doc</a>`
            : '—'}</td>
          <td style="display:flex;gap:8px">
            <button class="sm approve" onclick="approve('${d.id}')">Approve</button>
            <button class="sm danger" onclick="reject('${d.id}')">Reject</button>
          </td>
        </tr>`;
    });
  }

  async function approve(id) {
    if (!confirm('Approve this doctor?')) return;
    await fetch(`${BASE}/approve/${id}`, { method: 'POST', headers: headers() });
    document.getElementById('row-' + id)?.remove();
  }

  async function reject(id) {
    const reason = prompt('Reason for rejection (sent to doctor):');
    if (reason === null) return;
    await fetch(`${BASE}/reject/${id}`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ reason }),
    });
    document.getElementById('row-' + id)?.remove();
  }

  async function loadReports() {
    const res  = await fetch(`${BASE}/reports`, { headers: headers() });
    const data = await res.json();
    const body = document.getElementById('reportsBody');
    body.innerHTML = '';
    (data.reports || []).forEach(r => {
      const date = new Date(r.created_at).toLocaleDateString('en-IN');
      body.innerHTML += `
        <tr>
          <td>${esc(r.reporter?.full_name || '?')}</td>
          <td><strong>${esc(r.reported?.full_name || '?')}</strong></td>
          <td>${esc(r.reason)}</td>
          <td>${date}</td>
          <td><button class="sm danger"
            onclick="suspend('${r.reported_user_id}')">Suspend</button></td>
        </tr>`;
    });
  }

  async function suspend(id) {
    if (!confirm('Suspend this user?')) return;
    await fetch(`${BASE}/suspend/${id}`, { method: 'POST', headers: headers() });
    alert('User suspended.');
    loadReports();
  }

  async function loadStats() {
    const res  = await fetch(`${BASE}/stats`, { headers: headers() });
    const data = await res.json();
    const grid = document.getElementById('statsGrid');
    grid.innerHTML = `
      <div class="stat-card"><div class="num">${data.totalStudents || 0}</div>
        <div class="lbl">Total Students</div></div>
      <div class="stat-card"><div class="num">${data.totalDoctors || 0}</div>
        <div class="lbl">Total Doctors</div></div>
      <div class="stat-card"><div class="num">${data.pendingVerification || 0}</div>
        <div class="lbl">Pending Review</div></div>
      <div class="stat-card"><div class="num">${data.activeProSubscribers || 0}</div>
        <div class="lbl">Pro Subscribers</div></div>
    `;
    document.getElementById('headerStats').textContent =
      `${data.totalStudents + data.totalDoctors} total users`;
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
